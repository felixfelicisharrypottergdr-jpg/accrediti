<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Generatore Accrediti — Scheda Valori</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --parchment: #EEE4CD;
            --parchment-panel: #FBF7EC;
            --parchment-deep: #E4D6AF;
            --ink: #2B2233;
            --ink-soft: #5B5468;
            --gold: #9C6B24;
            --gold-deep: #7A5119;
            --gold-soft: #D8C08A;
            --line: #D9C79A;
            --green: #3F6B4F;
            --green-soft: #E4EEE6;
            --red: #8B3A3A;
            --red-soft: #F5E6E1;
            --amber: #A9762F;
            --amber-soft: #FBF0D9;
            --ink-panel: #241A2E;
            --ink-panel-2: #2E2239;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Source Sans 3', 'Segoe UI', sans-serif;
            background:
                radial-gradient(ellipse at top left, rgba(156,107,36,0.06), transparent 55%),
                radial-gradient(ellipse at bottom right, rgba(139,58,58,0.05), transparent 55%),
                var(--parchment);
            color: var(--ink);
            margin: 0;
            padding: 28px 20px 60px;
            line-height: 1.5;
        }
        h1, h2 { color: var(--ink); font-weight: 600; margin-top: 0; }
        .container { max-width: 1250px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

        .masthead { text-align: center; margin-bottom: 4px; }
        .masthead .eyebrow {
            font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 15px;
            color: var(--gold-deep); letter-spacing: .04em; display: block; margin-bottom: 2px;
        }
        .masthead h1 {
            font-family: 'Cinzel', serif; font-size: 32px; letter-spacing: .03em;
            margin: 0; color: var(--ink);
        }
        .masthead .rule {
            width: 220px; height: 1px; margin: 14px auto 0; position: relative;
            background: linear-gradient(90deg, transparent, var(--gold-soft) 20%, var(--gold) 50%, var(--gold-soft) 80%, transparent);
        }
        .masthead .rule::after {
            content: "✦"; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-52%);
            background: var(--parchment); color: var(--gold); padding: 0 10px; font-size: 13px;
        }

        .panel {
            background: var(--parchment-panel);
            padding: 26px 28px;
            border-radius: 12px;
            border: 1px solid var(--line);
            box-shadow: 0 1px 2px rgba(43,34,51,.04), 0 8px 24px rgba(43,34,51,.06);
        }
        .panel h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px; font-weight: 600; letter-spacing: .01em;
            display: flex; align-items: center; gap: 12px;
            border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 18px;
        }
        .step-num {
            display: inline-flex; align-items: center; justify-content: center;
            width: 28px; height: 28px; border-radius: 50%;
            background: var(--gold); color: #fff; font-family: 'Source Sans 3', sans-serif;
            font-size: 14px; font-weight: 700; flex-shrink: 0;
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 760px) { .grid-2 { grid-template-columns: 1fr; } }

        textarea, input {
            width: 100%; padding: 12px 14px; border: 1px solid var(--gold-soft); border-radius: 8px;
            box-sizing: border-box; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px;
            background-color: #fff; color: var(--ink);
        }
        textarea:focus, input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(156,107,36,.14); }
        textarea { resize: vertical; min-height: 160px; }

        .radio-group {
            margin-bottom: 18px; background: var(--parchment-deep); padding: 12px 16px;
            border-radius: 8px; font-weight: 600; border: 1px solid var(--gold-soft);
        }
        .radio-group label { display: inline; font-weight: normal; }

        button {
            background: linear-gradient(180deg, #B4813A, var(--gold-deep));
            color: #fff9ec; padding: 15px 26px; border: none; border-radius: 9px; cursor: pointer;
            font-family: 'Source Sans 3', sans-serif; font-size: 15px; font-weight: 700; width: 100%;
            letter-spacing: .02em;
            transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
            box-shadow: 0 1px 0 rgba(255,255,255,.25) inset, 0 6px 14px rgba(122,81,25,.28);
        }
        button:hover { transform: translateY(-1px); box-shadow: 0 1px 0 rgba(255,255,255,.3) inset, 0 10px 20px rgba(122,81,25,.34); }
        button:active { transform: translateY(0); }

        .btn-row { display: flex; gap: 12px; }
        .btn-row button { flex: 1; }

        .btn-secondary {
            background: var(--parchment-panel); color: var(--ink); border: 2px solid var(--gold-soft) !important;
            box-shadow: none;
        }
        .btn-secondary:hover { box-shadow: 0 4px 10px rgba(122,81,25,.15); }

        .btn-danger {
            background: var(--parchment-panel); color: var(--red); border: 2px solid var(--red) !important;
            box-shadow: none;
        }
        .btn-danger:hover { background: var(--red-soft); }

        .btn-copia {
            width: auto; padding: 8px 16px; font-size: 13px; margin-top: 8px;
            background: var(--parchment-panel); color: var(--ink); border: 2px solid var(--gold-soft) !important;
            box-shadow: none;
        }
        .btn-copia:hover { box-shadow: 0 4px 10px rgba(122,81,25,.15); }

        .btn-torna-su {
            position: fixed; bottom: 26px; right: 26px; width: 52px; height: 52px; padding: 0;
            border-radius: 50%; font-size: 20px; z-index: 999; display: flex;
            align-items: center; justify-content: center;
        }

        .output-box {
            background-color: var(--ink-panel); color: #EDE3CE; border-left: 4px solid var(--green);
            font-family: 'JetBrains Mono', monospace; border-color: var(--ink-panel-2);
            border-left-color: var(--green);
        }

        label { font-weight: 700; display: block; margin-bottom: 5px; margin-top: 16px; color: var(--ink-soft); font-size: 13.5px; }

        .guida-box {
            background: var(--amber-soft); border-left: 3px solid var(--amber); padding: 12px 14px;
            margin-bottom: 10px; border-radius: 0 8px 8px 0; font-size: 13px; color: #5C4517; line-height: 1.55;
        }
        .guida-box strong { color: #4A3410; }
        .guida-box code {
            background: #fff; padding: 1px 5px; border: 1px solid var(--gold-soft); border-radius: 4px;
            font-family: 'JetBrains Mono', monospace; font-weight: 500; color: var(--red); font-size: 12px;
        }
        .info-box {
            background: var(--green-soft); border-left: 3px solid var(--green); padding: 14px 16px;
            margin-bottom: 10px; border-radius: 0 8px 8px 0; font-size: 13.5px; color: #234132; line-height: 1.6;
        }
        .warn-box {
            display: none; background: var(--red-soft); border-left: 3px solid var(--red); padding: 12px 14px;
            margin-top: 14px; border-radius: 0 8px 8px 0; font-size: 13px; color: #5B2323; line-height: 1.55;
        }
        .warn-box.show { display: block; }
        .format-tag {
            display: inline-block; font-family: 'Source Sans 3', sans-serif; font-size: 11px; font-weight: 700;
            background: var(--amber-soft); color: var(--gold-deep); padding: 2px 8px; border-radius: 999px;
            letter-spacing: .01em; margin-left: 8px; vertical-align: middle; white-space: nowrap; border: 1px solid var(--gold-soft);
        }


        /* =========================================================
           UX/UI v3 — interfaccia progressiva + filtro tipo PG
           ========================================================= */
        body {
            background:
                radial-gradient(circle at 10% -5%, rgba(196,154,75,.16), transparent 32%),
                radial-gradient(circle at 93% 8%, rgba(69,91,72,.08), transparent 28%),
                linear-gradient(180deg, #F1E8D4 0%, #E9DDC1 100%);
            background-attachment: fixed;
            padding: 22px 18px 64px;
        }
        .container { max-width: 1160px; gap: 16px; }
        .masthead {
            position: relative; overflow: hidden; padding: 24px 22px 22px; margin-bottom: 0;
            border-radius: 20px; border: 1px solid rgba(195,157,88,.48);
            background: linear-gradient(145deg, #362A3E 0%, #261E2D 58%, #201923 100%);
            box-shadow: 0 18px 38px rgba(43,34,51,.17), inset 0 1px 0 rgba(255,255,255,.06);
        }
        .masthead::before, .masthead::after { content:""; position:absolute; pointer-events:none; border-radius:50%; border:1px solid rgba(224,199,142,.08); }
        .masthead::before { width:250px; height:250px; left:-145px; top:-170px; }
        .masthead::after { width:310px; height:310px; right:-185px; bottom:-245px; }
        .masthead h1 { color:#F6E8BF; font-size:clamp(27px,4vw,36px); text-shadow:0 3px 16px rgba(0,0,0,.28); }
        .masthead .eyebrow { color:#DCC38B; text-transform:uppercase; letter-spacing:.11em; font-size:12px; }
        .masthead .rule::after { background:#261E2D; color:#D7B66C; }
        .masthead-subtitle { margin:9px auto 0; max-width:680px; color:#D9CFC0; font-size:13px; }
        .top-note { margin:0; border-radius:12px; border-left-width:4px; box-shadow:0 7px 18px rgba(55,42,31,.05); }
        .panel { padding:22px 24px; border-radius:16px; border-color:rgba(184,156,101,.38); background:linear-gradient(180deg, rgba(255,252,244,.98), rgba(248,241,226,.98)); box-shadow:0 10px 26px rgba(55,42,31,.07), inset 0 1px 0 rgba(255,255,255,.75); }
        .panel h2 { border-bottom:0; padding-bottom:0; margin-bottom:6px; font-size:23px; }
        .step-intro { margin:0 0 17px; color:#746A78; font-size:12.5px; }
        .step-num { background:linear-gradient(145deg,#B6853D,#81571F); box-shadow:0 3px 8px rgba(122,81,25,.22); }
        .type-picker { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:15px; }
        .type-choice { position:relative; display:block; margin:0; cursor:pointer; }
        .type-choice input { position:absolute; opacity:0; pointer-events:none; }
        .type-choice-card { min-height:90px; display:grid; grid-template-columns:42px 1fr; grid-template-rows:auto auto; column-gap:12px; align-items:center; padding:15px 16px; border-radius:14px; border:1px solid rgba(156,107,36,.28); background:rgba(255,255,255,.76); box-shadow:0 6px 16px rgba(55,42,31,.045); transition:.15s ease; }
        .type-choice-card i { grid-row:1 / span 2; width:42px; height:42px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:#F2E6CB; color:var(--gold-deep); font-size:17px; }
        .type-choice-card strong { color:var(--ink); font-size:14.5px; }
        .type-choice-card small { color:var(--ink-soft); font-size:11.5px; font-weight:500; line-height:1.35; }
        .type-choice:hover .type-choice-card { transform:translateY(-1px); border-color:rgba(156,107,36,.55); }
        .type-choice input:checked + .type-choice-card { color:#FFF7E5; border-color:rgba(224,199,142,.42); background:linear-gradient(145deg,#4A394F,#2A2131); box-shadow:0 9px 20px rgba(46,36,55,.20); }
        .type-choice input:checked + .type-choice-card strong { color:#FFF4D8; }
        .type-choice input:checked + .type-choice-card small { color:#DED1C1; }
        .type-choice input:checked + .type-choice-card i { background:rgba(216,192,138,.15); color:#E5C982; }
        .type-context { margin-top:11px; padding:10px 12px; border-radius:9px; background:#F7ECD3; color:#684D1D; font-size:12px; }
        .field-card { padding:15px 16px; margin-top:12px; border:1px solid rgba(184,156,101,.30); border-radius:12px; background:rgba(255,255,255,.55); }
        .field-card:first-of-type { margin-top:0; }
        .field-card label { margin-top:0; color:#514859; font-size:13px; }
        .field-card textarea { min-height:120px; }
        .field-card.compact textarea { min-height:88px; }
        .field-card input { min-height:42px; }
        .field-help { margin:8px 0 10px; border:0; }
        .field-help summary { display:inline-flex; align-items:center; gap:6px; cursor:pointer; color:var(--gold-deep); font-size:11.5px; font-weight:700; user-select:none; list-style:none; }
        .field-help summary::-webkit-details-marker { display:none; }
        .field-help summary::before { content:"＋"; width:17px; height:17px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; background:#F2E6CB; font-size:11px; }
        .field-help[open] summary::before { content:"−"; }
        .field-help .guida-box { margin:8px 0 0; font-size:12px; padding:10px 12px; }
        .optional-group { margin-top:12px; border:1px dashed rgba(156,107,36,.35); border-radius:12px; background:rgba(255,255,255,.28); }
        .optional-group > summary { cursor:pointer; list-style:none; padding:13px 15px; color:var(--gold-deep); font-weight:800; font-size:12.5px; }
        .optional-group > summary::-webkit-details-marker { display:none; }
        .optional-group > summary::before { content:"▸"; margin-right:8px; }
        .optional-group[open] > summary::before { content:"▾"; }
        .optional-group .field-card { margin:0 12px 12px; }
        .specific-grid { display:grid; grid-template-columns:1fr; gap:12px; }
        .specific-section { padding:14px 15px; border-radius:12px; border:1px solid rgba(184,156,101,.30); background:rgba(255,255,255,.52); }
        .specific-section-title { display:flex; align-items:center; gap:9px; margin-bottom:3px; color:var(--ink); font-weight:800; font-size:13.5px; }
        .specific-section-title i { color:var(--gold-deep); width:20px; text-align:center; }
        .specific-section-sub { color:var(--ink-soft); font-size:11.5px; margin-bottom:10px; }
        .specific-section .field-card { padding:12px 0 0; margin-top:10px; border:0; border-top:1px solid rgba(184,156,101,.22); border-radius:0; background:transparent; }
        .specific-section .field-card:first-of-type { border-top:0; padding-top:0; margin-top:0; }
        .pg-hidden { display:none !important; }
        .action-bar { position:sticky; bottom:10px; z-index:40; display:flex; gap:10px; padding:10px; border:1px solid rgba(156,107,36,.26); border-radius:14px; background:rgba(248,241,226,.90); backdrop-filter:blur(10px); box-shadow:0 10px 25px rgba(55,42,31,.12); }
        .action-bar button { min-height:48px; }
        .action-primary { flex:2; }
        .action-reset { flex:1; }
        #risultati_panel { scroll-margin-top:18px; }
        .results-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
        .result-card { padding:14px; border-radius:12px; border:1px solid rgba(184,156,101,.30); background:rgba(255,255,255,.52); }
        .result-card label { margin-top:0; }
        .result-card textarea { min-height:230px; }
        #trasferimenti_panel { padding:14px; border-radius:12px; border:1px solid rgba(156,107,36,.28); background:#FBF0D9; }
        @media (max-width:760px) { body { padding:12px 9px 48px; } .masthead { border-radius:16px; padding:20px 14px; } .panel { padding:17px 14px; border-radius:13px; } .type-picker, .results-grid { grid-template-columns:1fr; } .action-bar { bottom:6px; } .action-bar button { padding:12px 10px; font-size:13px; } }
    </style>
</head>
<body>

<div class="container">
    <div class="masthead">
        <span class="eyebrow">Felix Felicis GDR · Staff</span>
        <h1>Generatore Accrediti</h1>
        <div class="rule"></div>
    </div>

    <div class="panel">
        <h2><span class="step-num">1</span>Lista della Spesa</h2>
        <textarea id="inputComplessivoOriginale" style="min-height:210px" placeholder="Incolla qui l’intera Lista della Spesa pubblicata dal PG..."></textarea>
        <div id="import_status" class="info-box" style="display:none; margin-top:12px;"></div>
    </div>

    <div class="panel">
        <h2><span class="step-num">2</span>Scheda Valori</h2>
        <textarea id="inputScheda" style="min-height:240px" placeholder="Incolla qui il codice HTML completo della Scheda Valori..."></textarea>
    </div>

    <div class="panel" id="dati_mancanti_panel" style="display:none;">
        <h2><span class="step-num">3</span>Dati da completare</h2>
        <div class="specific-section pg-only-studente" id="link_voto_wrap" style="display:none;">
            <div class="specific-section-title"><i class="fa-solid fa-link"></i>Link della richiesta</div>
            <div class="field-card">
                <label for="linkVoto">URL del post della Lista</label>
                <input type="text" id="linkVoto" placeholder="es. ?t=80721630#entry682188505">
            </div>
        </div>
        <div class="specific-section pg-only-studente" id="punti_casa_wrap" style="display:none; margin-top:12px;">
            <div class="specific-section-title"><i class="fa-solid fa-shield-halved"></i>Punti Casa</div>
            <div class="field-card">
                <label for="inputPuntiCasaIniziali">Valore attuale prima dell’accredito</label>
                <input type="number" id="inputPuntiCasaIniziali" placeholder="es. 1245">
            </div>
        </div>
    </div>

    <div style="display:none !important;" aria-hidden="true">
        <input type="radio" id="pgStudente" name="tipoPg" value="studente">
        <input type="radio" id="pgAdulto" name="tipoPg" value="adulto" checked>
        <textarea id="inputComplessivo"></textarea>
        <textarea id="modMaterie"></textarea>
        <input type="text" id="modSapienze">
        <textarea id="modInventario"></textarea>
    </div>

    <div class="action-bar">
        <button class="action-primary" onclick="elaboraTerminale()">Genera risultati →</button>
        <button type="button" class="btn-danger action-reset" onclick="resetGeneratore()">Cancella tutto</button>
    </div>

    <div class="panel" id="risultati_panel" style="display:none;">
        <h2><span class="step-num">4</span>Risultati finali</h2>
        <div id="ignorati_box" class="warn-box"></div>
        <div class="results-grid">
            <div class="result-card">
                <label for="outForum">Registro Accrediti</label>
                <textarea id="outForum" class="output-box" readonly></textarea>
                <button type="button" class="btn-copia" id="btn_copia_forum" onclick="copiaCampo('outForum','btn_copia_forum')">📋 Copia registro</button>
            </div>
            <div class="result-card">
                <label for="outScheda">Scheda Valori aggiornata</label>
                <textarea id="outScheda" class="output-box" readonly></textarea>
                <button type="button" class="btn-copia" id="btn_copia_scheda" onclick="copiaCampo('outScheda','btn_copia_scheda')">📋 Copia scheda aggiornata</button>
            </div>
        </div>
        <div id="trasferimenti_panel" style="display:none; margin-top:14px;">
            <label>📦 Trasferimenti ad altri PG</label>
            <div id="trasferimenti_destinatari"></div>
        </div>
    </div>

    <button type="button" class="btn-torna-su" onclick="tornaSu()" title="Torna su">⬆️</button>

</div>

<script>
function aggiornaTipoPGUI() {
  const tipo = document.querySelector('input[name="tipoPg"]:checked')?.value || 'adulto';
  document.querySelectorAll('.pg-only-studente').forEach(el => el.classList.toggle('pg-hidden', tipo !== 'studente'));
  document.querySelectorAll('.pg-only-adulto').forEach(el => el.classList.toggle('pg-hidden', tipo !== 'adulto'));
}

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('input[name="tipoPg"]').forEach(r => r.addEventListener('change', aggiornaTipoPGUI));
  aggiornaTipoPGUI();
  const listaInput = document.getElementById('inputComplessivoOriginale');
  if (listaInput) listaInput.addEventListener('input', () => applicaProtocolloLista(false));
});

function formatNumeroItaliano(num) {
  const n = Number(num);
  if (Number.isInteger(n)) return String(n);
  return String(n).replace('.', ',');
}
function toNumber(val) {
  if (val === undefined || val === null) return 0;
  const raw = String(val).trim();

  if (!raw || raw === '//' || raw === '-') return 0;

  const cleaned = raw
    .replace(/\*/g, '')
    .replace(/\s+/g, '')
    .replace(',', '.');

  const n = parseFloat(cleaned);
  return Number.isFinite(n) ? n : 0;
}
function escapeRx(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

// ============ STRUMENTI DI SUPPORTO (Torna su, Cancella tutto, Copia) ============
function tornaSu() {
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetGeneratore() {
  if (!confirm('Cancellare tutti i campi e ricominciare da capo? Questa azione non si può annullare.')) return;

  document.querySelectorAll('textarea, input[type="text"], input[type="number"], input[type="url"]').forEach(el => {
    el.value = '';
  });

  const studente = document.getElementById('pgStudente');
  const adulto = document.getElementById('pgAdulto');
  if (studente) studente.checked = false;
  if (adulto) adulto.checked = true;
  aggiornaTipoPGUI();

  const risultatiPanel = document.getElementById('risultati_panel');
  if (risultatiPanel) risultatiPanel.style.display = 'none';

  const warnBox = document.getElementById('ignorati_box');
  if (warnBox) {
    warnBox.classList.remove('show');
    warnBox.innerHTML = '';
  }

  const trasferimentiPanel = document.getElementById('trasferimenti_panel');
  if (trasferimentiPanel) trasferimentiPanel.style.display = 'none';
  const status = document.getElementById('import_status');
  if (status) { status.style.display = 'none'; status.innerHTML = ''; }
  const mancanti = document.getElementById('dati_mancanti_panel');
  if (mancanti) mancanti.style.display = 'none';

  tornaSu();
}

async function copiaCampo(idCampo, idBottone) {
  const campo = document.getElementById(idCampo);
  const btn = document.getElementById(idBottone);
  if (!campo || !campo.value.trim()) return;
  const etichettaOriginale = btn.textContent;
  function mostraConferma(ok) {
    btn.textContent = ok ? '✅ Copiato!' : '⚠️ Copia manualmente (Ctrl+C)';
    setTimeout(() => { btn.textContent = etichettaOriginale; }, 2000);
  }
  try {
    await navigator.clipboard.writeText(campo.value);
    mostraConferma(true);
  } catch (e) {
    campo.removeAttribute('readonly');
    campo.focus();
    campo.select();
    try {
      mostraConferma(document.execCommand('copy'));
    } catch (e2) {
      mostraConferma(false);
    }
    campo.setAttribute('readonly', 'readonly');
  }
}

function normalizeText(s) {
  return String(s || '')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}
function leggiProtocolloAccrediti(raw) {
  const testo = String(raw || '').replace(/\r/g, '');
  const m = testo.match(/\[FF-ACCREDITI-V2\]\s*([\s\S]*?)\s*\[\/FF-ACCREDITI-V2\]/i);
  if (!m) return { ok: false, errore: 'Blocco FF-ACCREDITI-V2 non trovato.' };
  try {
    const data = JSON.parse(m[1].trim());
    if (!data || Number(data.versione) !== 2) return { ok: false, errore: 'Versione dati non valida.' };
    if (!['studente','adulto'].includes(data.tipoPg)) return { ok: false, errore: 'Tipo PG non valido nei dati della Lista.' };
    if (!Array.isArray(data.boxA) || !Array.isArray(data.boxE) || !Array.isArray(data.boxF) || !Array.isArray(data.boxG)) {
      return { ok: false, errore: 'Blocco dati incompleto.' };
    }
    if (!Array.isArray(data.trasferimenti)) data.trasferimenti = [];
    return { ok: true, data };
  } catch (e) {
    return { ok: false, errore: 'Blocco dati della Lista non leggibile.' };
  }
}

function splitEntries(raw) {
  return String(raw || '')
    .split(/\n|;|,(?=\s*[^,:]+:\s*)/)
    .map(x => x.trim())
    .filter(Boolean);
}
function parseKeyValueList(raw) {
  const out = [];
  for (const entry of splitEntries(raw)) {
    const mAll = entry.match(/^TUTTE\s*:\s*(.+?)\s*:\s*(.+)$/i);
    if (mAll) {
      out.push({
        type: 'all',
        materia: mAll[1].trim(),
        pattern: mAll[2].trim()
      });
      continue;
    }
    const m = entry.match(/^(.+?)\s*:\s*(.+)$/);
    if (m) out.push({ type: 'single', key: m[1].trim(), value: m[2].trim() });
  }
  return out;
}

function estraiDeltaDaBoxA() {
  const txt = document.getElementById('inputComplessivo').value || '';
  const righe = txt.split(/\n+/).map(s => s.trim()).filter(Boolean);
  const deltas = {};
  for (const stat in STAT_ALIASES) deltas[stat] = 0;

  for (const riga of righe) {
    const lower = normalizeText(riga);
    // "Galeoni Extra" e' un fondo a parte (Box A dedicato piu' sotto): non va
    // letto qui come una normale variazione di Galeoni, altrimenti verrebbe
    // conteggiato due volte.
    if (/\bgaleon[ei]\s+extra\b/.test(lower)) continue;
    for (const stat in STAT_ALIASES) {
      const alias = STAT_ALIASES[stat].find(a => lower.includes(normalizeText(a)));
      if (!alias) continue;
      const rx = new RegExp('([+-]?\\d+(?:[\\.,]\\d+)?)\\s*' + escapeRx(alias), 'i');
      const m = riga.match(rx);
      if (m) deltas[stat] += toNumber(m[1]);
      break;
    }
  }
  return deltas;
}

function estraiDeltaGaleoniExtraDaBoxA() {
  const txt = document.getElementById('inputComplessivo').value || '';
  const rx = /([+-])\s*(\d+(?:[.,]\d+)?)\s*(?:Galeoni\s+Extra|Extra\s+Galeoni)\b/gi;
  let totale = 0;
  let m;
  while ((m = rx.exec(txt)) !== null) totale += (m[1] === '-' ? -1 : 1) * toNumber(m[2]);
  return totale;
}

function aggiornaGaleoniExtra(html, delta, baseRiferita) {
  const risultato = {
    html, delta: delta || 0, iniziale: null, inizialeScheda: null, finale: null,
    baseDaTesto: baseRiferita !== null && baseRiferita !== undefined ? Number(baseRiferita) : null,
    applicato: false, errore: null
  };
  if (!delta) return risultato;

  const rx = /([+-]?\d+(?:[.,]\d+)?)(\s+extra\s+da\s+spendere\b[^\n<]*)/i;
  const m = html.match(rx);
  if (!m) {
    risultato.errore = 'Richiesta una variazione dei Galeoni Extra, ma nella Scheda Valori non è stata trovata la riga "extra da spendere".';
    return risultato;
  }

  const inizialeScheda = toNumber(m[1]);
  const baseCalcolo = risultato.baseDaTesto !== null && Number.isFinite(risultato.baseDaTesto)
    ? risultato.baseDaTesto
    : inizialeScheda;
  const finale = baseCalcolo + delta;

  risultato.inizialeScheda = inizialeScheda;
  risultato.iniziale = baseCalcolo;
  risultato.finale = finale;

  if (finale < 0) {
    risultato.errore = `La variazione dei Galeoni Extra porterebbe il fondo sotto zero (${formatNumeroItaliano(baseCalcolo)} → ${formatNumeroItaliano(finale)}). Non è stata applicata.`;
    return risultato;
  }

  risultato.html = html.replace(rx, `${formatNumeroItaliano(finale)}$2`);
  risultato.applicato = true;
  return risultato;
}

function estraiValoriInizialiScheda(html) {
  const iniziali = {};
  const markers = {};
  let m;

  m = html.match(/<b>\s*Punti Post:\s*<\/b>\s*([^<\n\r]*)/i);
  if (m) {
    const raw = (m[1] || '').trim();
    iniziali['Punti Post'] = toNumber(raw);
    markers['Punti Post'] = {
      star: /\*/.test(raw),
      slash: raw === '//' || raw === ''
    };
  }

  m = html.match(/<b>\s*Galeoni:\s*<\/b>\s*([^<\n\r]*)/i);
  if (m) {
    const raw = (m[1] || '').trim();
    iniziali['Galeoni'] = toNumber(raw);
    markers['Galeoni'] = {
      star: /\*/.test(raw),
      slash: raw === '//' || raw === ''
    };
  }

  ['sociali', 'magici', 'fisici'].forEach(divClass => {
    const block = html.match(new RegExp('<div class="' + divClass + '">([\\s\\S]*?)<\\/div>', 'i'));
    if (!block) return;
    const headersMatch = block[1].match(/<tr class="nomi">([\s\S]*?)<\/tr>/i);
    const valuesMatch = block[1].match(/<tr class="valori">([\s\S]*?)<\/tr>/i);
    if (!headersMatch || !valuesMatch) return;

    const headers = [...headersMatch[1].matchAll(/<td[^>]*>([\s\S]*?)<\/td>/gi)]
      .map(x => x[1].replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim());
    const valueCells = [...valuesMatch[1].matchAll(/<td([^>]*)>([\s\S]*?)<\/td>/gi)];

    headers.forEach((h, i) => {
      const key = h.replace(/\s+/g, ' ').trim();
      const raw = valueCells[i] ? valueCells[i][2].replace(/<[^>]+>/g, '').trim() : '';
      iniziali[key] = toNumber(raw);
      markers[key] = {
        star: /\*/.test(raw),
        slash: raw === '//' || raw === ''
      };
    });
  });

  m = html.match(
    /<b>\s*Prestigio\s*-\s*[^<]+<\/b>[\s\S]*?<div class="prestigio"[^>]*>\s*([^<]+)\s*<\/div>/i
  );
  if (m) {
    const raw = (m[1] || '').trim();
    iniziali['Prestigio'] = toNumber(raw);
    markers['Prestigio'] = {
      star: /\*/.test(raw),
      slash: raw === '//' || raw === ''
    };
  }

  m = html.match(
    /<tr\s+class="nomi">[\s\S]*?<td[^>]*colspan="4"[^>]*>[\s\S]*?Prestigio[\s\S]*?<\/td>[\s\S]*?<tr\s+class="valori">[\s\S]*?<div\s+class="prestigio"[^>]*>\s*([^<]+)\s*<\/div>/i
  );
  if (m) {
    const raw = (m[1] || '').trim();
    iniziali['Prestigio'] = toNumber(raw);
    markers['Prestigio'] = {
      star: /\*/.test(raw),
      slash: raw === '//' || raw === ''
    };
  }

  return { iniziali, markers };
}

function renderStatValue(label, value, markers) {
  const base = formatNumeroItaliano(value);
  if (markers && markers[label] && markers[label].star) return base + '*';
  return base;
}

function aggiornaTabella(html, divClass, finali, markers, deltas) {
  const rx = new RegExp(
    '(<div class="' + divClass + '">[\\s\\S]*?<tr class="nomi">)([\\s\\S]*?)(<\\/tr>[\\s\\S]*?<tr class="valori">)([\\s\\S]*?)(<\\/tr>[\\s\\S]*?<\\/div>)',
    'i'
  );
  return html.replace(
    rx,
    function(_, p1, headersHtml, p3, valuesHtml, p5) {
      const headers = [...headersHtml.matchAll(/<td[^>]*>([\s\S]*?)<\/td>/gi)]
        .map(x => x[1].replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim());

      const valueCells = [...valuesHtml.matchAll(/<td([^>]*)>([\s\S]*?)<\/td>/gi)];
      let rebuilt = '';

      valueCells.forEach((cell, idx) => {
        const attrs = cell[1];
        const label = headers[idx] || '';
        const originalRaw = cell[2].replace(/<[^>]+>/g, '').trim();

        // Riscriviamo la cella SOLO se questa specifica statistica e' stata
        // toccata da un delta diverso da zero: qualunque altro valore (incluso
        // il segnaposto "//" per statistiche non ancora sbloccate) resta invariato.
        let finalVal = originalRaw;
        const toccata = deltas && Object.prototype.hasOwnProperty.call(deltas, label) && deltas[label] !== 0;
        if (toccata && Object.prototype.hasOwnProperty.call(finali, label)) {
          finalVal = renderStatValue(label, finali[label], markers);
        }

        rebuilt += `<td${attrs}>${finalVal}</td>`;
      });

      return p1 + headersHtml + p3 + rebuilt + p5;
    }
  );
}

function aggiornaSchedaConValori(html, data, deltas) {
  let out = html;
  const iniziali = { ...(data.iniziali || {}) };
  const markers = { ...(data.markers || {}) };
  const finali = { ...iniziali };
  const ignorati = [];

  Object.keys(deltas || {}).forEach(stat => {
    const delta = deltas[stat] || 0;
    if (delta === 0) return;
    if (Object.prototype.hasOwnProperty.call(iniziali, stat)) {
      finali[stat] = (iniziali[stat] || 0) + delta;
    } else {
      // La statistica non esiste in QUESTA scheda (es. "Prestigio" su una Scheda
      // Valori Studente, o un refuso nel nome): il delta non verrà scritto da
      // nessuna parte, quindi non deve nemmeno comparire nel registro come se
      // fosse stato applicato.
      ignorati.push(stat);
    }
  });

  if ((deltas['Punti Post'] || 0) !== 0 && Object.prototype.hasOwnProperty.call(finali, 'Punti Post')) {
    const rendered = renderStatValue('Punti Post', finali['Punti Post'], markers);
    out = out.replace(
      /(<b>\s*Punti Post:\s*<\/b>\s*)([^<\n\r]*)/i,
      `$1${rendered}`
    );
  }

  if ((deltas['Galeoni'] || 0) !== 0 && Object.prototype.hasOwnProperty.call(finali, 'Galeoni')) {
    const rendered = renderStatValue('Galeoni', finali['Galeoni'], markers);
    out = out.replace(
      /(<b>\s*Galeoni:\s*<\/b>\s*)([^<\n\r]*)/i,
      `$1${rendered}`
    );
  }

  // --- Debito (Punti Post / Galeoni): resta un valore FISSO finche' il totale
  // accumulato di quella risorsa non lo raggiunge o supera — non si riduce mano
  // a mano che si guadagna. Al raggiungimento/superamento, il debito si azzera
  // e l'eccedenza (accumulato - debito) diventa il nuovo saldo disponibile.
  function gestisciDebito(nomeCampo, unita) {
    const rxDebito = new RegExp('(<b>\\s*Debito \\(' + escapeRx(nomeCampo) + '\\):\\s*<\\/b>\\s*)(-?[\\d.,]+)(\\s*' + escapeRx(unita) + ')', 'i');
    const mDebito = out.match(rxDebito);
    if (!mDebito) return;
    if (!Object.prototype.hasOwnProperty.call(finali, nomeCampo)) return;

    const debitoAttuale = Math.abs(toNumber(mDebito[2]));
    if (debitoAttuale <= 0) return;
    if (finali[nomeCampo] < debitoAttuale) return; // non ancora raggiunto: il debito resta invariato

    const eccedenza = finali[nomeCampo] - debitoAttuale;
    finali[nomeCampo] = eccedenza;

    const rxCampo = new RegExp('(<b>\\s*' + escapeRx(nomeCampo) + ':\\s*<\\/b>\\s*)([^<\\n\\r]*)', 'i');
    out = out.replace(rxCampo, `$1${renderStatValue(nomeCampo, eccedenza, markers)}`);

    // il debito e' estinto: cancello l'intera riga (icona compresa), non solo il valore
    const rxRigaCompleta = new RegExp(
      '[ \\t]*<i[^>]*>\\s*<\\/i>\\s*<b>\\s*Debito \\(' + escapeRx(nomeCampo) + '\\):\\s*<\\/b>\\s*-?[\\d.,]+\\s*' + escapeRx(unita) + '\\s*\\r?\\n?',
      'i'
    );
    out = out.replace(rxRigaCompleta, '');
  }
  gestisciDebito('Punti Post', 'PP');
  gestisciDebito('Galeoni', 'G');

  out = aggiornaTabella(out, 'sociali', finali, markers, deltas);
  out = aggiornaTabella(out, 'magici', finali, markers, deltas);
  out = aggiornaTabella(out, 'fisici', finali, markers, deltas);

  if ((deltas['Prestigio'] || 0) !== 0 && Object.prototype.hasOwnProperty.call(finali, 'Prestigio')) {
    const prestigioFinale = finali['Prestigio'];
    const renderedPrestigio = renderStatValue('Prestigio', prestigioFinale, markers);
    const widthPrestigio = formatNumeroItaliano(prestigioFinale) + '%';

    out = out.replace(
      /(<tr\s+class="nomi">[\s\S]*?<td[^>]*colspan="4"[^>]*>[\s\S]*?Prestigio[\s\S]*?<\/td>\s*<\/tr>\s*<tr\s+class="valori">[\s\S]*?<td[^>]*colspan="4"[^>]*>\s*<div\s+class="contpunti">\s*<div\s+class="max"[^>]*style=")([^"]*)(")(><\/div>\s*<div\s+class="prestigio"[^>]*style=")([^"]*)(")(>)([\s\S]*?)(<\/div>\s*<\/div>\s*<\/td>\s*<\/tr>)/i,
      function(_, p1, maxStyle, p3, p4, prestigioStyle, p6, p7, oldValue, p9) {
        const newMaxStyle = maxStyle.replace(/width\s*:\s*[^;"]+%?/i, '').trim();
        const newPrestigioStyle = prestigioStyle.replace(/width\s*:\s*[^;"]+%?/i, '').trim();

        const fixedMaxStyle = (newMaxStyle ? newMaxStyle.replace(/\s*;?\s*$/, '; ') : '') + `width:${widthPrestigio}`;
        const fixedPrestigioStyle = (newPrestigioStyle ? newPrestigioStyle.replace(/\s*;?\s*$/, '; ') : '') + `width:${widthPrestigio}`;

        return p1 + fixedMaxStyle + p3 + p4 + fixedPrestigioStyle + p6 + p7 + renderedPrestigio + p9;
      }
    );
  }

  return { html: out, finali, markers, ignorati };
}

function splitEntriesInventario(raw) {
  // A differenza di Box E/F, qui NON splittiamo sulla virgola: i nomi degli
  // oggetti possono contenerne una (es. "Paraorecchi Anti-Mandragola, di
  // colore verde"), quindi ogni voce deve stare su una riga propria (o essere
  // separata da ';').
  return String(raw || '')
    .split(/\n|;/)
    .map(x => x.trim())
    .filter(Boolean);
}

function dedupTrasferimenti(items) {
  const seen = new Set();
  const out = [];
  (items || []).forEach(t => {
    const key = [normalizeText(t.name), t.qty || 1, normalizeText(t.recipientName), String(t.recipientUrl || '').trim()].join('|');
    if (seen.has(key)) return;
    seen.add(key);
    out.push({ ...t });
  });
  return out;
}

function pulisciTailOggettoPerTrasferimento(tail) {
  return String(tail || '').replace(/^\s*:\s*/, '').trim();
}

function renderTrasferimentiDestinatari(trasferimenti) {
  const panel = document.getElementById('trasferimenti_panel');

  host.innerHTML = '';
  if (!trasferimenti || !trasferimenti.length) { panel.style.display = 'none'; return; }

  const gruppi = new Map();
  trasferimenti.forEach(t => {
    const key = `${t.recipientUrl || ''}|${t.recipientName || ''}`;
    if (!gruppi.has(key)) gruppi.set(key, []);
    gruppi.get(key).push(t);
  });

  let idx = 0;
  gruppi.forEach(items => {
    idx++;
    const t0 = items[0];
    const card = document.createElement('div');
    card.className = 'result-card';
    card.style.marginTop = idx === 1 ? '8px' : '12px';

    host.appendChild(card);
    card.querySelector(`[data-genera-dest="${idx}"]`).addEventListener('click', () => {
      const input = document.getElementById(inId).value || '';

      out.value = res.html;
      out.style.display = 'block';
      document.getElementById(btnId).style.display = 'inline-block';
    });
  });
  panel.style.display = 'block';

function parseInventarioMods(raw) {
  const ops = [];
  const nonRiconosciute = [];
  const trasferimenti = [];
  for (const entryRaw of splitEntriesInventario(raw)) {
    const entry = entryRaw.trim();

    // Nuovo formato Lista della Spesa: accettiamo sia la riga narrativa completa
    // (con eventuale "-" iniziale) sia il Box G compatto. La parte destinatario
    // non cambia la scheda corrente: serve per preparare l'accredito al ricevente.
    let m = entry.match(/^\s*-?\s*(.+?)\s*:\s*-(\d+)\s*[—–-]\s*oggetto\s+da\s+trasferire\s+a\s*\[URL=([^\]]+)\](.+?)\[\/URL\]\s*$/i);
    if (m) {
      const t = {
        name: m[1].trim(),
        qty: parseInt(m[2], 10) || 1,
        recipientUrl: m[3].trim(),
        recipientName: m[4].trim()
      };
      trasferimenti.push(t);
      ops.push({ type: 'qty', name: t.name, delta: -t.qty, transferKey: trasferimenti.length - 1 });
      continue;
    }

    // Il trattino iniziale del post narrativo non fa parte del nome dell'oggetto.
    const entryPulita = entry.replace(/^\s*-\s+/, '');

    // "NUOVO:" da solo resta Oggetto per compatibilita' con le richieste gia'
    // scritte prima che categoria diventasse obbligatoria; "NUOVO OGGETTO/POZIONE/IMMUNITA:"
    // specifica esplicitamente in quale sezione della scheda va inserito.
    const mNuovoCat = entryPulita.match(/^NUOVO\s+(OGGETTO|POZIONE|IMMUNIT[AÀ])\s*:\s*(.+?)\s*\[(\d+)\]\s*:\s*(.*)$/i);
    if (mNuovoCat) {
      const categoria = mNuovoCat[1].toUpperCase().replace('À', 'A');
      ops.push({ type: 'new', categoria, name: mNuovoCat[2].trim(), qty: parseInt(mNuovoCat[3], 10) || 1, desc: mNuovoCat[4].trim() });
      continue;
    }
    if (/^NUOVO\s*:/i.test(entryPulita)) {
      const mLegacy = entryPulita.match(/^NUOVO\s*:\s*(.+?)\s*\[(\d+)\]\s*:\s*(.*)$/i);
      if (mLegacy) { ops.push({ type: 'new', categoria: 'OGGETTO', name: mLegacy[1].trim(), qty: parseInt(mLegacy[2], 10) || 1, desc: mLegacy[3].trim() }); continue; }
      nonRiconosciute.push(entryRaw);
      continue;
    }
    if (/^NUOVO\s+/i.test(entryPulita)) {
      nonRiconosciute.push(entryRaw);
      continue;
    }

    m = entryPulita.match(/^USI\s*:\s*(.+?)\s*:\s*([+-]?\d+)$/i);
    if (m) {
      ops.push({ type: 'uses', name: m[1].trim(), delta: parseInt(m[2], 10) || 0 });
      continue;
    }
    if (/^USI\s*:/i.test(entryPulita)) { nonRiconosciute.push(entryRaw); continue; }

    m = entryPulita.match(/^(.+?)\s*:\s*([+-]?\d+)$/i);
    if (m) { ops.push({ type: 'qty', name: m[1].trim(), delta: parseInt(m[2], 10) || 0 }); continue; }

    if (entryPulita.trim()) nonRiconosciute.push(entryRaw);
  }
  return { ops, nonRiconosciute, trasferimenti };
}

function parseObjectLine(line) {
  const original = line;
  let text = line.trim();
  if (!text.startsWith('-')) return null;
  text = text.replace(/^-+\s*/, '');

  // Formato reale della scheda: "<b>Nome [Qty]:</b> resto" (i due punti stanno
  // DENTRO il tag grassetto, prima della chiusura) — va riconosciuto per primo.
  let m = text.match(/^<b>(.+?)\s*\[(\d+)\]:\s*<\/b>(.*)$/i);
  if (m) {
    return { original, name: m[1].trim(), qty: parseInt(m[2], 10) || 1, tail: m[3] || '', bold: true, colonInside: true };
  }

  m = text.match(/^<b>(.+?)\s*\[(\d+)\]<\/b>(.*)$/i);
  if (m) {
    return { original, name: m[1].trim().replace(/:$/, ''), qty: parseInt(m[2], 10) || 1, tail: m[3] || '', bold: true };
  }

  m = text.match(/^(\d+)\s+(.+)$/i);
  if (m) {
    return { original, name: m[2].trim().replace(/:$/, ''), qty: parseInt(m[1], 10) || 1, tail: '', bold: false, numberPrefix: true };
  }

  m = text.match(/^<b>(.+?):\s*<\/b>(.*)$/i);
  if (m) {
    return { original, name: m[1].trim(), qty: 1, tail: m[2] || '', bold: true, noQtyBracket: true, colonInside: true };
  }

  m = text.match(/^<b>(.+?)<\/b>(.*)$/i);
  if (m) {
    return { original, name: m[1].trim().replace(/:$/, ''), qty: 1, tail: m[2] || '', bold: true, noQtyBracket: true };
  }

  return { original, name: text.replace(/<[^>]+>/g, '').trim().replace(/:$/, ''), qty: 1, tail: '', raw: true };
}

function rebuildObjectLine(obj) {
  // Se l'oggetto proviene da una riga che aveva i due punti dentro </b> (il
  // formato usato dalla scheda reale), lo riscrivo identico — non cambio la
  // formattazione di un oggetto solo perche' lo stiamo aggiornando.
  if (obj.colonInside) {
    if (obj.noQtyBracket && obj.qty === 1) return `- <b>${obj.name}:</b>${obj.tail}`;
    return `- <b>${obj.name} [${obj.qty}]:</b>${obj.tail}`;
  }
  if (obj.bold || !obj.raw) {
    if (obj.noQtyBracket && obj.qty === 1) return `- <b>${obj.name}:</b>${obj.tail}`;
    return `- <b>${obj.name} [${obj.qty}]:</b>${obj.tail}`;
  }
  return `- <b>${obj.name} [${obj.qty}]:</b>${obj.tail || ''}`;
}

function updateUsesInTail(tail, delta) {
  const m =
    tail.match(/\((\d+)\s*\/\s*(\d+)\s*us[oi][^) ]*\)/i) ||
    tail.match(/\((\d+)\s*\/\s*(\d+)\s*post[^)]*\)/i) ||
    tail.match(/\((\d+)\s*\/\s*(\d+)\s*role[^)]*\)/i);
  if (!m) return tail;
  const current = parseInt(m[1], 10) || 0;
  const next = Math.max(0, current + delta);
  return tail.replace(m[0], m[0].replace(m[1], String(next)));
}

function estraiSezioneBagaglio(html, icona) {
  const rx = new RegExp(`(<details><summary><i class="fa-solid ${icona}"><\\/i>\\s*<b>[^<]+:<\\/b><\\/summary>)([\\s\\S]*?)(<\\/details>)`, 'i');
  const m = html.match(rx);
  if (!m) return null;
  return { rx, start: m[1], body: m[2], end: m[3] };
}

function aggiornaBagaglio(html, modInventarioRaw, trasferimentiEsterni) {
  const parsed = parseInventarioMods(modInventarioRaw);
  const ops = parsed.ops;
  const nonRiconosciute = parsed.nonRiconosciute;
  const trasferimenti = dedupTrasferimenti([...(parsed.trasferimenti || []), ...(trasferimentiEsterni || [])]);
  if (!ops.length) return { html, nonRiconosciute, trasferimenti };

  const sezioni = {};
  CATEGORIE_BAGAGLIO.forEach(cat => {
    const sez = estraiSezioneBagaglio(html, cat.icona);
    if (!sez) return;
    const byName = new Map();
    sez.body.split(/\n/).forEach(line => {
      const parsedObj = parseObjectLine(line);
      if (parsedObj) byName.set(normalizeText(parsedObj.name), parsedObj);
    });
    sezioni[cat.tag] = { ...sez, byName, cat };
  });

  const trasferimentiUsati = new Set();
  ops.forEach(op => {
    if (op.type === 'new') {
      const target = sezioni[op.categoria] || sezioni['OGGETTO'];
      if (!target) return;
      const key = normalizeText(op.name);
      if (target.byName.has(key)) {
        const obj = target.byName.get(key);
        obj.qty += op.qty;
        if (op.desc) obj.tail = ` ${op.desc}`;
      } else {
        target.byName.set(key, { name: op.name, qty: op.qty, tail: op.desc ? ` ${op.desc}` : '', bold: true });
      }
      return;
    }

    const key = normalizeText(op.name);
    const target = Object.values(sezioni).find(s => s.byName.has(key));
    if (!target) { nonRiconosciute.push(`${op.name}: oggetto non trovato in nessuna sezione del Bagaglio`); return; }
    const obj = target.byName.get(key);

    if (op.type === 'qty') {
      // Se questa diminuzione corrisponde a un trasferimento rilevato nella Lista,
      // salviamo PRIMA della sottrazione categoria e descrizione del bene ceduto.
      if (op.delta < 0) {
        const idx = trasferimenti.findIndex((t, i) =>
          !trasferimentiUsati.has(i) &&
          normalizeText(t.name) === key &&
          Math.abs(op.delta) === (t.qty || 1)
        );
        if (idx >= 0) {
          trasferimentiUsati.add(idx);
          trasferimenti[idx].categoria = target.cat.tag;
          trasferimenti[idx].categoriaLabel = target.cat.label;
          trasferimenti[idx].descrizione = obj.tail || '';
          trasferimenti[idx].quantitaPrima = obj.qty || 0;
        }
      }
      obj.qty = Math.max(0, (obj.qty || 0) + op.delta);
    }
    if (op.type === 'uses') obj.tail = updateUsesInTail(obj.tail || '', op.delta);
  });

  let out = html;
  Object.values(sezioni).forEach(sez => {
    const finalObjs = [...sez.byName.values()]
      .filter(o => (o.qty || 0) > 0)
      .sort((a, b) => normalizeText(a.name).localeCompare(normalizeText(b.name), 'it'));
    const rebuilt = finalObjs.length ? '\n' + finalObjs.map(rebuildObjectLine).join('\n') : '';
    out = out.replace(sez.rx, sez.start + rebuilt + sez.end);
  });
  return { html: out, nonRiconosciute, trasferimenti };
}

function costruisciRegistro(iniziali, finali, deltaCasa, puntiCasaIniziali, extraInfo) {
  const lines = [];
  const mk = (label, short, key) => {
    const v0 = iniziali[key] || 0;
    const vf = finali[key] || 0;
    const d = vf - v0;
    if (d === 0) return null;
    return `<b>${label}</b> [color=${d >= 0 ? 'green' : 'red'}]${d >= 0 ? '+' : ''}${formatNumeroItaliano(d)} ${short}[/color] [${formatNumeroItaliano(v0)} ➔ ${formatNumeroItaliano(vf)}]`;
  };

  lines.push(mk('Complessivo PP spesi e guadagnati:', 'PP', 'Punti Post') || '<b>Complessivo PP spesi e guadagnati:</b> //');

  let rigaGaleoni = mk('Complessivo Galeoni spesi e guadagnati:', 'G', 'Galeoni');
  if (extraInfo && extraInfo.applicato && extraInfo.delta) {
    const d = extraInfo.delta;
    const extraTxt = `[color=${d >= 0 ? 'green' : 'red'}]${d >= 0 ? '+' : ''}${formatNumeroItaliano(d)} G extra[/color] [${formatNumeroItaliano(extraInfo.iniziale)} ➔ ${formatNumeroItaliano(extraInfo.finale)}]`;
    rigaGaleoni = rigaGaleoni ? `${rigaGaleoni}; ${extraTxt}` : `<b>Complessivo Galeoni spesi e guadagnati:</b> ${extraTxt}`;
  }
  lines.push(rigaGaleoni || '<b>Complessivo Galeoni spesi e guadagnati:</b> //');

  const boxHPuntiCasaCompilato =
    String(document.getElementById('inputPuntiCasaIniziali').value || '').trim() !== '';

  if (boxHPuntiCasaCompilato) {
    const vf = puntiCasaIniziali + deltaCasa;
    if (deltaCasa) {
      lines.push(`<b>Complessivo Punti Casa spesi e persi:</b> [color=${deltaCasa >= 0 ? 'green' : 'red'}]${deltaCasa >= 0 ? '+' : ''}${formatNumeroItaliano(deltaCasa)} Punti Casa[/color] [${formatNumeroItaliano(puntiCasaIniziali)} ➔ ${formatNumeroItaliano(vf)}]`);
    } else {
      lines.push(`<b>Complessivo Punti Casa spesi e persi:</b> [color=green]+0 Punti Casa[/color] [${formatNumeroItaliano(puntiCasaIniziali)} ➔ ${formatNumeroItaliano(vf)}]`);
    }
  }

  const altri = [];
  ['Dialettica','Popolarità','Stima Docenti','Bontà','Malvagità','Virtuoso','Sinistro','Prestigio',
   'Acume','Empatia','Percezione','Potenza','Tecnica','Volontà','Destrezza','Fatica','Resistenza','Salute'].forEach(key => {
    const v0 = iniziali[key] || 0;
    const vf = finali[key] || 0;
    const d = vf - v0;
    if (d !== 0) altri.push(`[color=${d >= 0 ? 'green' : 'red'}]${d >= 0 ? '+' : ''}${formatNumeroItaliano(d)} ${key}[/color] [${formatNumeroItaliano(v0)} ➔ ${formatNumeroItaliano(vf)}]`);
  });
  lines.push(`<b>Altri punti/altro guadagnati o persi:</b> ${altri.length ? altri.join(', ') : '//'}`);
  return lines.join('\n');
}

function aggiornaVotoConLink(cellaHtml, nuovoVoto, linkVoto) {
  const clean = cellaHtml.replace(/\s+/g, ' ').trim();

  // Caso generale: zero o piu' blocchi <del>...</del> gia' presenti (storico di
  // voti precedenti), seguiti dal voto attualmente in vigore (lettere semplici).
  // Vanno SEMPRE preservati TUTTI i <del> gia' presenti, aggiungendone uno nuovo
  // solo per il voto che stiamo appena superando — mai sovrascrivere lo storico.
  const mStorico = clean.match(/^((?:<del>[\s\S]*?<\/del>\s*)*)([A-Z]+)\s*$/i);
  if (mStorico) {
    const storicoEsistente = mStorico[1];
    const vecchioAttuale = mStorico[2];
    const nuovoDel = linkVoto
      ? `<del>[URL=${linkVoto}]${vecchioAttuale}[/URL]</del> `
      : `<del>${vecchioAttuale}</del> `;
    return storicoEsistente + nuovoDel + nuovoVoto;
  }

  // Fallback di sicurezza: la cella non segue il formato atteso (storico + voto
  // semplice) — proviamo comunque a barrare solo le ultime lettere trovate,
  // senza toccare il resto del contenuto della cella.
  const mUltimo = clean.match(/([A-Z]+)\s*$/i);
  if (mUltimo) {
    const vecchio = mUltimo[1];
    const replacement = linkVoto
      ? `<del>[URL=${linkVoto}]${vecchio}[/URL]</del> ${nuovoVoto}`
      : `<del>${vecchio}</del> ${nuovoVoto}`;
    return clean.replace(/([A-Z]+)\s*$/i, replacement);
  }

  return clean;
}

function estraiPatternVoto(pattern) {
  const m = pattern.trim().match(/^([A-Z])\s*>\s*([A-Z])$/i);
  if (m) return { from: m[1].toUpperCase(), to: m[2].toUpperCase() };
  return { from: null, to: pattern.trim().toUpperCase() };
}

function aggiornaTutteConoscenzeMateria(html, materia, pattern, linkVoto) {
  const matRx = escapeRx(materia).replace(/\s+/g, '\\s+');
  const { from, to } = estraiPatternVoto(pattern);
  let out = html;

  const reMateria = new RegExp(
    '(<details[^>]*>\\s*<summary[^>]*>[\\s\\S]*?<b>\\s*' + matRx + '\\s*<\\/b>[\\s\\S]*?<\\/summary>)([\\s\\S]*?)(<\\/details>)',
    'i'
  );

  out = out.replace(reMateria, function(_, start, inner, end) {
    let nuovoInner = inner.replace(
      /(<tr[^>]*>[\s\S]*?<td[^>]*>[\s\S]*?<\/td>\s*<td[^>]*>)([\s\S]*?)(<\/td>[\s\S]*?<\/tr>)/gi,
      function(__, c1, cellaVoto, c3) {
        const clean = cellaVoto.replace(/\s+/g, ' ').trim();
        const matchVote = clean.match(/([A-Z])\s*$/i);
        if (!matchVote) return c1 + cellaVoto + c3;
        const votoCorrente = matchVote[1].toUpperCase();
        if (from && votoCorrente !== from) return c1 + cellaVoto + c3;
        const nuovo = aggiornaVotoConLink(cellaVoto, to, linkVoto);
        return c1 + nuovo + c3;
      }
    );
    return start + nuovoInner + end;
  });

  return out;
}

function aggiornaPianoStudiStudente(html, rawMods, linkVoto) {
  const mods = parseKeyValueList(rawMods);
  if (!mods.length) return html;

  let out = html;

  mods.forEach(mod => {
    if (mod.type === 'single') {
      const nome = mod.key;
      const nuovoVoto = mod.value.toUpperCase();
      const nomeNorm = normalizeText(nome);

      out = out.replace(
        /(<tr[^>]*>[\s\S]*?<td[^>]*>)([\s\S]*?)(<\/td>\s*<td[^>]*[^>]*text-align\s*:\s*center[^>]*>)([\s\S]*?)(<\/td>[\s\S]*?<\/tr>)/gi,
        function(match, p1, cellaNome, p3, cellaVoto, p5) {
          const plainNome = normalizeText(cellaNome.replace(/<[^>]+>/g, ' '));
          if (!plainNome.includes(nomeNorm)) return match;
          return p1 + cellaNome + p3 + aggiornaVotoConLink(cellaVoto, nuovoVoto, linkVoto) + p5;
        }
      );

      out = out.replace(
        /(<tr[^>]*>[\s\S]*?<td[^>]*>)([\s\S]*?)(<\/td>\s*<td[^>]*>)([\s\S]*?)(<\/td>[\s\S]*?<\/tr>)/gi,
        function(match, p1, cellaNome, p3, cellaVoto, p5) {
          const plainNome = normalizeText(cellaNome.replace(/<[^>]+>/g, ' '));
          const votoGiaStoricitizzato = /<del>/i.test(cellaVoto);
          if (!plainNome.includes(nomeNorm)) return match;
          if (votoGiaStoricitizzato && normalizeText(cellaVoto).includes(normalizeText(nuovoVoto))) return match;
          return p1 + cellaNome + p3 + aggiornaVotoConLink(cellaVoto, nuovoVoto, linkVoto) + p5;
        }
      );
    }

    if (mod.type === 'all') {
      out = aggiornaTutteConoscenzeMateria(out, mod.materia, mod.pattern, linkVoto);
    }
  });

  return out;
}

function aggiornaSapienzeAdulto(html, rawMods) {
  const mods = parseKeyValueList(rawMods);
  if (!mods.length) return html;

  let out = html;

  mods.forEach(mod => {
    if (mod.type !== 'single') return;

    const nome = mod.key;
    const livello = parseInt(mod.value, 10);
    if (!Number.isFinite(livello)) return;

    const nomeRx = escapeRx(nome).replace(/\s+/g, '\\s+');

    const rx = new RegExp(
      '(<tr[^>]*>\\s*<t[dh][^>]*>\\s*' + nomeRx + '\\s*<\\/t[dh]>\\s*<t[dh][^>]*>[\\s\\S]*?<div[^>]*class="indice"[^>]*data-html="livello)(\\d+)(")',
      'i'
    );

    out = out.replace(rx, `$1${livello}$3`);
  });

  return ricalcolaTotaliSapienze(out);
}

function ricalcolaTotaliSapienze(html) {
  // Ogni blocco Sapienza ha una riga finale "Sapienza NOME: X/Y" che e' un
  // TOTALE calcolato (somma dei livelli di tutte le Conoscenze in quel
  // blocco), non un valore a se' stante — va ricalcolato ogni volta che
  // cambia un livello, altrimenti resta con la cifra vecchia.
  return html.replace(
    /(<div class="sapienza"><table>[\s\S]*?<\/table><\/div>)/gi,
    (blocco) => {
      const livelli = [...blocco.matchAll(/data-html="livello(\d+)"/gi)].map(m => parseInt(m[1], 10) || 0);
      if (!livelli.length) return blocco;
      const somma = livelli.reduce((a, b) => a + b, 0);
      return blocco.replace(
        /(<t[dh][^>]*>\s*Sapienza\s+[^:<]+:\s*)\d+(\s*\/\s*\d+\s*<\/t[dh]>)/i,
        `$1${somma}$2`
      );
    }
  );
}

function ricalcolaTotaleEccezionale(html) {
  // Isola la sezione "Piano di Studi" dell'anno CORRENTE (data-label="Studi"):
  // solo le Conoscenze qui dentro contano per il contatore — non le Extra/Avanzate
  // (altra sezione della scheda) né gli anni passati archiviati nello [SPOILER]
  // in fondo, che restano intoccati come registro storico.
  const rxSezione = /(data-label="Studi">[\s\S]*?)(<div data-label="[^"]*"|$)/;
  const m = html.match(rxSezione);
  if (!m) return html;
  const sezione = m[1];

  // conta le celle voto il cui valore FINALE (dopo eventuali <del> storici gia'
  // presenti) e' "E" — stessa logica di lettura usata da aggiornaVotoConLink,
  // cosi' un voto sceso da E a un voto inferiore non resta erroneamente contato.
  const celleVoto = [...sezione.matchAll(/<td[^>]*text-align\s*:\s*center[^>]*>([\s\S]*?)<\/td>/gi)];
  let conteggio = 0;
  celleVoto.forEach(cella => {
    const clean = cella[1].replace(/\s+/g, ' ').trim();
    const mVoto = clean.match(/^(?:<del>[\s\S]*?<\/del>\s*)*([A-Z]+)\s*$/i);
    if (mVoto && mVoto[1].toUpperCase() === 'E') conteggio++;
  });

  const sezioneAggiornata = sezione.replace(
    /(<b>\s*Totale Eccezionale:?\s*<\/b>\s*)(\d+)/i,
    `$1${conteggio}`
  );
  return html.replace(sezione, sezioneAggiornata);
}

function aggiornaPianoOSapienze(html) {
  const tipo = document.querySelector('input[name="tipoPg"]:checked')?.value || 'adulto';
  const linkVoto = (document.getElementById('linkVoto').value || '').trim();
  const modMaterie = document.getElementById('modMaterie').value || '';
  const modSapienze = document.getElementById('modSapienze').value || '';

  if (!html.trim()) return html;

  if (tipo === 'studente') {
    let out = aggiornaPianoStudiStudente(html, modMaterie, linkVoto);
    out = ricalcolaTotaleEccezionale(out);
    return out;
  }
  return aggiornaSapienzeAdulto(html, modSapienze);
}

function elaboraTerminale() {
  const protocollo = applicaProtocolloLista(true);
  if (!protocollo) return;
  const schedaValoriHTML = document.getElementById('inputScheda').value || '';
  if (!schedaValoriHTML.trim()) { alert('Incolla la Scheda Valori.'); return; }

  const puntiCasaRichiesti = protocollo.tipoPg === 'studente' && protocollo.boxA.some(r => /Punti\s+Casa/i.test(r));
  if (puntiCasaRichiesti && String(document.getElementById('inputPuntiCasaIniziali').value || '').trim() === '') {
    alert('Inserisci i Punti Casa attuali prima dell’accredito.'); return;
  }
  const votiRichiesti = protocollo.tipoPg === 'studente' && protocollo.boxE.length > 0;
  if (votiRichiesti && !String(document.getElementById('linkVoto').value || '').trim()) {
    alert('Inserisci il link del post della Lista per aggiornare lo storico dei voti.'); return;
  }

  const modInventario = document.getElementById('modInventario').value || '';
  const puntiCasaIniziali = parseInt(document.getElementById('inputPuntiCasaIniziali').value, 10) || 0;
  const trasferimentiDaLista = (protocollo.trasferimenti || []).map(t => ({
    name: t.nome,
    qty: parseInt(t.quantita, 10) || 1,
    recipientUrl: t.destinatarioLink || '',
    recipientName: t.destinatarioNome || ''
  }));

  const deltas = estraiDeltaDaBoxA();
  const extraGaleoni = estraiDeltaGaleoniExtraDaBoxA();
  const riconciliati = {
    deltas,
    extraGaleoni,
    correzioni: [],
    originale: { baseExtraRiferita: protocollo.galeoniExtraBase, extraPresente: extraGaleoni !== 0 }
  };

  const dataScheda = estraiValoriInizialiScheda(schedaValoriHTML);
  const updatedValori = aggiornaSchedaConValori(schedaValoriHTML, dataScheda, deltas);

  let html = updatedValori.html;
  const extraInfo = aggiornaGaleoniExtra(html, riconciliati.extraGaleoni, riconciliati.originale.baseExtraRiferita);
  html = extraInfo.html;

  const risultatoBagaglio = aggiornaBagaglio(html, modInventario, trasferimentiDaLista);
  html = risultatoBagaglio.html;
  html = aggiornaPianoOSapienze(html);

  const registro = costruisciRegistro(dataScheda.iniziali, updatedValori.finali, deltas['Punti Casa'] || 0, puntiCasaIniziali, extraInfo);

  document.getElementById('outForum').value = registro;
  document.getElementById('outScheda').value = html;

  const risultatiPanel = document.getElementById('risultati_panel');
  if (risultatiPanel) risultatiPanel.style.display = 'block';

  renderTrasferimentiDestinatari(risultatoBagaglio.trasferimenti || []);

  const warnBox = document.getElementById('ignorati_box');
  if (warnBox) {
    const avvisiStat = [];

    if (risultatoBagaglio.trasferimenti && risultatoBagaglio.trasferimenti.length) {
      avvisiStat.push('<b>📦 Trasferimento rilevato:</b> oggetto scalato dal PG corrente; accredito destinatario preparato sotto.');
    }

    if (updatedValori.ignorati && updatedValori.ignorati.length) {
      avvisiStat.push('<b>⚠ Attenzione:</b> la Lista contiene ' +
        (updatedValori.ignorati.length > 1 ? 'queste statistiche' : 'questa statistica') +
        ' che non ' + (updatedValori.ignorati.length > 1 ? 'esistono' : 'esiste') +
        ' nella Scheda Valori e non sono state applicate: <b>' +
        updatedValori.ignorati.join(', ') + '</b>.');
    }

    if (extraInfo.errore) avvisiStat.push('<b>⚠ Galeoni Extra:</b> ' + extraInfo.errore);

    if (
      riconciliati.originale.extraPresente &&
      riconciliati.originale.baseExtraRiferita !== null &&
      extraInfo.inizialeScheda !== null &&
      Math.abs(riconciliati.originale.baseExtraRiferita - extraInfo.inizialeScheda) > 1e-9
    ) {
      avvisiStat.push(
        `<b>⚠ Galeoni Extra:</b> la Lista indica una base di ${formatNumeroItaliano(riconciliati.originale.baseExtraRiferita)} Galeoni Extra, ` +
        `mentre la Scheda Valori ne contiene ${formatNumeroItaliano(extraInfo.inizialeScheda)}. ` +
        `È stata usata la base della Lista, ottenendo ${formatNumeroItaliano(extraInfo.finale)} Galeoni Extra finali.`
      );
    }

    if (risultatoBagaglio.nonRiconosciute && risultatoBagaglio.nonRiconosciute.length) {
      avvisiStat.push('<b>⚠ Attenzione:</b> il Bagaglio della Lista contiene ' +
        (risultatoBagaglio.nonRiconosciute.length > 1 ? 'queste righe' : 'questa riga') +
        ' che non ' + (risultatoBagaglio.nonRiconosciute.length > 1 ? 'corrispondono' : 'corrisponde') +
        ' al formato previsto, quindi <u>non ' + (risultatoBagaglio.nonRiconosciute.length > 1 ? 'sono state applicate' : 'è stata applicata') + '</u>: <b>' +
        risultatoBagaglio.nonRiconosciute.map(r => r.replace(/</g, '&lt;')).join('</b>, <b>') + '</b>.');
    }

    ['Punti Post', 'Galeoni'].forEach(nomeCampo => {
      if (Object.prototype.hasOwnProperty.call(updatedValori.finali, nomeCampo) && updatedValori.finali[nomeCampo] < 0) {
        const haDebito = new RegExp('<b>\\s*Debito \\(' + escapeRx(nomeCampo) + '\\):', 'i').test(html);
        if (!haDebito) {
          avvisiStat.push(
            `<b>⚠ Attenzione:</b> ${nomeCampo} risulta negativo (${formatNumeroItaliano(updatedValori.finali[nomeCampo])}) ` +
            `e nella scheda non è presente una voce Debito (${nomeCampo}).`
          );
        }
      }
    });

    if (avvisiStat.length) {
      warnBox.innerHTML = avvisiStat.join('<br><br>');
      warnBox.classList.add('show');
    } else {
      warnBox.classList.remove('show');
      warnBox.innerHTML = '';
    }
  }
  if (risultatiPanel) risultatiPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
</script>

</body>
</html>
